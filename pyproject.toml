[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
  "redis>=5.2,<7", "httpx>=0.28,<1", "websockets>=14,<16",
  "cryptography>=44,<47", "protobuf>=6.31,<7", "tzdata>=2025.1", "numpy>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1", "grpcio-tools>=1.73,<1.79"]

[tool.setuptools.packages.find]
include = ["api*", "config*", "market_data*", "analysis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires TEST_DATABASE_URL pointing to disposable PostgreSQL"]

[tool.ruff]
line-length = 110
exclude = ["market_data/upstox/MarketDataFeed_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
